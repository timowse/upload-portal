<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Datei teilen" />
<title>Datei teilen</title>
<style>
  :root{
    --bg:#f6f8fc; --card:#fff; --line:rgba(15,23,42,.10); --soft:rgba(15,23,42,.04);
    --text:#0f172a; --muted:#64748b; --accent:#3659e5; --ink:#fff;
    --ok:#166534; --ok-bg:#dcfce7; --ok-line:#86efac; --err:#b91c1c;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d12; --card:#141822; --line:rgba(255,255,255,.10); --soft:rgba(255,255,255,.05);
      --text:#eef2f9; --muted:#96a2b6; --accent:#6b8afd;
      --ok:#4ade80; --ok-bg:rgba(34,197,94,.14); --ok-line:rgba(134,239,172,.42); --err:#fca5a5;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);line-height:1.5;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:600px;margin:0 auto;
    padding:calc(26px + var(--safe-t)) calc(16px + var(--safe-r)) calc(30px + var(--safe-b)) calc(16px + var(--safe-l));
  }
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:1.62rem;margin:0 0 6px;letter-spacing:-.025em}
  header p{color:var(--muted);margin:0;font-size:.95rem}
  .hidden{display:none !important}

  .drop{
    position:relative;border:1.5px dashed var(--line);border-radius:20px;
    padding:34px 18px;text-align:center;background:var(--card);
    transition:border-color .2s,background .2s;
  }
  .drop.over{border-color:var(--accent);background:var(--soft)}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
  .drop .plus{
    width:60px;height:60px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;
    background:var(--accent);color:var(--ink);font-size:2rem;line-height:1;
  }
  .drop h2{margin:0 0 5px;font-size:1.1rem}
  .drop p{margin:0;color:var(--muted);font-size:.9rem}

  .limit{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 16px;margin-top:12px;
  }
  .limit-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .limit-head span{color:var(--muted);font-size:.86rem}
  .limit-head strong{font-size:1.02rem;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;background:none;
    margin:14px 0 8px;height:26px;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:99px;background:var(--line);
  }
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--accent);border:3px solid var(--card);margin-top:-10px;
    box-shadow:0 2px 8px rgba(15,23,42,.28);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;background:var(--accent);
    border:3px solid var(--card);box-shadow:0 2px 8px rgba(15,23,42,.28);cursor:pointer;
  }
  .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin-top:-2px}
  .limit-note{margin:9px 0 0;color:var(--muted);font-size:.85rem;line-height:1.45}
  .limit-note b{color:var(--text);font-weight:650}

  .item{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-top:12px;
  }
  .item.ready{border-color:var(--ok-line)}
  .top{display:flex;gap:10px;align-items:center}
  .top .nm{flex:1;min-width:0;font-weight:650;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .sz{color:var(--muted);font-size:.82rem;flex:0 0 auto}
  .st{color:var(--muted);font-size:.84rem;margin-top:4px}
  .st.good{color:var(--ok);font-weight:650}
  .st.bad{color:var(--err);font-weight:600}
  .track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
  .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}
  .linkbox{
    display:flex;gap:8px;align-items:center;margin-top:11px;padding:10px 12px;
    background:var(--soft);border:1px solid var(--line);border-radius:12px;
  }
  .linkbox code{
    flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .acts{display:flex;gap:8px;margin-top:10px}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--text);
    border-radius:12px;padding:12px 16px;font:inherit;font-size:.93rem;font-weight:650;
    cursor:pointer;min-height:46px;flex:1;display:inline-flex;align-items:center;
    justify-content:center;gap:7px;text-decoration:none;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);border-color:transparent;color:var(--ink)}
  .notice{
    margin-top:18px;padding:13px 15px;border-radius:14px;background:var(--soft);
    border:1px solid var(--line);color:var(--muted);font-size:.86rem;text-align:center;
  }
  .notice.bad{color:var(--err);border-color:var(--err)}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 20px;
    font-size:.88rem;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;
    box-shadow:0 8px 28px rgba(15,23,42,.14);
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Datei teilen</h1>
    <p>Hochladen, Link bekommen, weiterschicken.</p>
  </header>

  <div class="drop" id="drop">
    <input type="file" id="pick" multiple />
    <div class="plus">+</div>
    <h2>Datei auswählen</h2>
    <p>Tippen oder hierher ziehen · mehrere gleichzeitig möglich</p>
  </div>

  <div class="limit hidden" id="limitbox">
    <div class="limit-head"><span>Maximale Dateigröße</span><strong id="limit-val">—</strong></div>
    <input type="range" id="limit" min="5" max="10" step="1" value="5" />
    <div class="ticks" id="ticks"></div>
    <p class="limit-note" id="limit-note"></p>
  </div>

  <div id="list"></div>
  <div class="notice hidden" id="notice"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const BASE = '';   // same origin
let CFG = { chunkSize: 32 * 1024 * 1024, baseBytes: 5 * 1024 ** 3,
            maxBytes: 10 * 1024 ** 3, days: 30, minDays: 7, accepting: true };
let ceiling = CFG.baseBytes;

const fmt = (n) => {
  const u = ['B','KB','MB','GB','TB']; let v = Number(n)||0, i = 0;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + ' ' + u[i];
};

// Mirrors days_for() on the server, so the page can state the trade before
// anything is sent. The server still decides; this only has to agree.
function daysFor(size) {
  const floor = CFG.minDays || 7;
  if (!CFG.baseBytes || size <= CFG.baseBytes) return CFG.days;
  const span = Math.max(1, CFG.maxBytes - CFG.baseBytes);
  const exact = CFG.days + (floor - CFG.days) * Math.min(1, (size - CFG.baseBytes) / span);
  const days = exact >= 10 ? Math.round(exact / 5) * 5 : Math.round(exact);
  return Math.max(floor, Math.min(CFG.days, days));
}

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function api(path, options) {
  const r = await fetch(BASE + path, options);
  if (!r.ok) {
    let detail = `HTTP ${r.status}`;
    try { detail = (await r.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return r.json();
}
const post = (path, body) => api(path, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: body === undefined ? undefined : JSON.stringify(body),
});

// Only XHR reports how much of a request body has left the device, which is
// the difference between a progress bar and a spinner.
function putChunk(url, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', BASE + url);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();
      let d = `HTTP ${xhr.status}`;
      try { d = JSON.parse(xhr.responseText).detail || d; } catch (_) {}
      reject(new Error(d));
    };
    xhr.onerror = () => reject(new Error('Verbindung unterbrochen'));
    xhr.send(blob);
  });
}

async function hand(url, title) {
  if (navigator.share) {
    try { await navigator.share({ title, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert'); }
  catch (_) { prompt('Link', url); }
}

function card(file) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<div class="top"><div class="nm"></div>
      <div class="sz">${fmt(file.size)} · ${daysFor(file.size)} Tage</div></div>
    <div class="st">Upload startet…</div>
    <div class="track"><div class="fill"></div></div>`;
  el.querySelector('.nm').textContent = file.name;
  $('list').appendChild(el);
  return {
    el,
    st: el.querySelector('.st'),
    fill: el.querySelector('.fill'),
    track: el.querySelector('.track'),
  };
}

function restzeit(seconds, pct) {
  if (!isFinite(seconds) || seconds < 0) return null;
  // Only promise "almost there" near the end. The browser reports bytes
  // handed to the socket, not bytes acknowledged, so the estimate runs
  // optimistic in the middle of an upload - and saying "gleich fertig" at
  // 40 % then leaves it standing for the whole second half.
  if (pct >= 90) return 'gleich fertig';
  const s = Math.max(seconds, 8);
  if (s < 90) return `noch etwa ${Math.max(10, Math.round(s / 5) * 5)} Sekunden`;
  const min = Math.round(s / 60);
  if (min < 60) return `noch etwa ${min} Minute${min === 1 ? '' : 'n'}`;
  const h = Math.floor(min / 60), rest = min % 60;
  return `noch etwa ${h} Stunde${h === 1 ? '' : 'n'}` + (rest ? ` ${rest} Min.` : '');
}

async function uploadOne(file, ui) {
  const init = await post('/api/upload/init', { name: file.name, size: file.size });
  const chunks = Math.max(1, Math.ceil(file.size / init.chunkSize));
  const started = Date.now();
  let sent = 0;

  // That the file travels in pieces is our problem, not the visitor's. The
  // page shows how far along it is and how long that will take.
  const show = (done) => {
    const pct = Math.min(100, Math.round((done / file.size) * 100));
    ui.fill.style.width = pct + '%';
    const elapsed = (Date.now() - started) / 1000;
    const left = done > 0 && elapsed > 1.5
      ? restzeit((file.size - done) / (done / elapsed), pct)
      : null;
    ui.st.textContent = `${pct} %` + (left ? ` · ${left}` : '');
  };

  show(0);
  for (let i = 0; i < chunks; i++) {
    const blob = file.slice(i * init.chunkSize, Math.min((i+1) * init.chunkSize, file.size));
    const base = sent;
    await putChunk(`/api/upload/part?id=${encodeURIComponent(init.uploadId)}&i=${i}`, blob,
      (loaded) => show(base + loaded));
    sent += blob.size;
    show(sent);
  }
  ui.st.textContent = 'wird abgeschlossen…';
  return post(`/api/upload/done?id=${encodeURIComponent(init.uploadId)}`);
}

function finish(ui, result) {
  ui.el.classList.add('ready');
  ui.track.remove();
  ui.st.className = 'st good';
  ui.st.textContent = `Fertig · Link gilt ${result.days} Tage`;
  const box = document.createElement('div');
  box.className = 'linkbox';
  box.innerHTML = '<code></code>';
  box.querySelector('code').textContent = result.link;
  const acts = document.createElement('div');
  acts.className = 'acts';
  acts.innerHTML = `<button class="btn primary" data-a="share">Teilen</button>
                    <button class="btn" data-a="copy">Kopieren</button>
                    <a class="btn" href="${result.link}" target="_blank" rel="noopener">Ansehen</a>`;
  acts.querySelector('[data-a=share]').addEventListener('click', () => hand(result.link, result.name));
  acts.querySelector('[data-a=copy]').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(result.link); toast('Link kopiert'); }
    catch (_) { prompt('Link', result.link); }
  });
  ui.el.append(box, acts);
}

// Every file keeps its own link. Once there are at least two, they also get
// one link that holds all of them, rebuilt as more arrive.
const session = [];

async function addBundle() {
  if (session.length < 2) return;
  let result;
  try {
    result = await post('/api/bundle', { tokens: session.map((l) => l.split('/').pop()) });
  } catch (_) {
    return;
  }
  document.getElementById('bundle')?.remove();
  const el = document.createElement('div');
  el.className = 'item ready';
  el.id = 'bundle';
  el.innerHTML = `<div class="top"><div class="nm">Alle ${result.count} Dateien zusammen</div></div>
    <div class="st good">Ein Link für alles</div>
    <div class="linkbox"><code></code></div>
    <div class="acts">
      <button class="btn primary" data-a="share">Teilen</button>
      <button class="btn" data-a="copy">Kopieren</button>
      <a class="btn" href="${result.link}" target="_blank" rel="noopener">Ansehen</a>
    </div>`;
  el.querySelector('code').textContent = result.link;
  el.querySelector('[data-a=share]').addEventListener('click',
    () => hand(result.link, `${result.count} Dateien`));
  el.querySelector('[data-a=copy]').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(result.link); toast('Link kopiert'); }
    catch (_) { prompt('Link', result.link); }
  });
  $('list').prepend(el);
}

async function run(files) {
  for (const file of Array.from(files)) {
    const ui = card(file);
    if (file.size > ceiling) {
      ui.track.remove();
      ui.st.className = 'st bad';
      ui.st.textContent = file.size <= CFG.maxBytes
        ? `Zu groß für ${fmt(ceiling)} — zieh den Regler höher.`
        : `Zu groß — mehr als ${fmt(CFG.maxBytes)} geht nicht.`;
      continue;
    }
    try {
      const result = await uploadOne(file, ui);
      finish(ui, result);
      session.push(result.link);
    } catch (err) {
      ui.track.remove();
      ui.st.className = 'st bad';
      ui.st.textContent = err.message;
    }
  }
  await addBundle();
}

$('pick').addEventListener('change', (e) => { run(e.target.files); e.target.value = ''; });
const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', (e) => { if (e.dataTransfer?.files) run(e.dataTransfer.files); });

async function boot() {
  // Page and API share one hostname, so there is nothing to look up first.
  try {
    CFG = await api('/api/config');
  } catch (_) {
    $('notice').className = 'notice bad';
    $('notice').textContent = 'Der Server ist gerade nicht erreichbar.';
    $('pick').disabled = true;
    return;
  }

  const slider = $('limit');
  const steps = CFG.scale || [{ bytes: CFG.maxBytes, days: CFG.days }];
  slider.min = 1;
  slider.max = steps.length;
  slider.value = 1;
  ceiling = steps[0].bytes;

  $('ticks').innerHTML = steps
    .map((st, i) => (i === 0 || i === steps.length - 1)
      ? `<span>${Math.round(st.bytes / 1024 ** 3)} GB</span>` : '<span></span>')
    .join('');

  const apply = () => {
    const step = steps[Math.min(steps.length - 1, Math.max(0, slider.value - 1))];
    ceiling = step.bytes;
    const gb = Math.round(step.bytes / 1024 ** 3);
    $('limit-val').textContent = gb + ' GB';
    $('limit-note').innerHTML = steps.length > 1 && slider.value > 1
      ? `Dateien bis <b>${gb} GB</b> werden <b>${step.days} Tage</b> gespeichert. `
        + `Je größer die Datei, desto kürzer bleibt sie liegen.`
      : `Dateien bis <b>${gb} GB</b> werden <b>${step.days} Tage</b> gespeichert. `
        + `Für größere Dateien den Regler höher ziehen — dafür läuft der Link früher ab.`;
  };
  slider.addEventListener('input', apply);
  apply();
  $('limitbox').classList.remove('hidden');

  if (!CFG.accepting) {
    $('notice').className = 'notice bad';
    $('notice').textContent = 'Zurzeit ist kein Speicherplatz frei. Bitte später nochmal.';
    $('pick').disabled = true;
  }
}
boot();
</script>
</body>
</html>
