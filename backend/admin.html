<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0d12" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Dateien" />
<title>Dateien</title>
<style>
  :root{
    --bg:#0b0d12; --card:#141822; --line:rgba(255,255,255,.10); --soft:rgba(255,255,255,.05);
    --text:#eef2f9; --muted:#96a2b6; --accent:#6b8afd; --ok:#4ade80; --danger:#f87171;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);line-height:1.5;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:720px;margin:0 auto;
    padding:calc(18px + var(--safe-t)) calc(14px + var(--safe-r)) calc(28px + var(--safe-b)) calc(14px + var(--safe-l));
  }
  .hidden{display:none !important}

  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  header h1{font-size:1.32rem;margin:0;letter-spacing:-.02em;flex:1}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--text);
    border-radius:12px;padding:11px 16px;font:inherit;font-size:.92rem;font-weight:650;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;text-decoration:none;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.ghost{background:none}
  .btn.danger{color:var(--danger)}
  .btn.sm{min-height:38px;padding:8px 13px;font-size:.86rem;border-radius:10px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:default}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .panel h2{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

  /* login */
  .login{max-width:380px;margin:14vh auto 0;text-align:center}
  .login .glyph{
    width:66px;height:66px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;
    background:rgba(107,138,253,.16);color:var(--accent);font-size:1.7rem;
  }
  input[type=password],input[type=number]{
    width:100%;padding:14px 16px;border-radius:13px;border:1px solid var(--line);
    background:var(--soft);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px;
  }
  input:focus{outline:2px solid var(--accent);outline-offset:1px}

  /* picker */
  .picker{
    position:relative;border:1.5px dashed var(--line);border-radius:18px;padding:24px 16px;
    text-align:center;background:var(--soft);margin-bottom:14px;
  }
  .picker.over{border-color:var(--accent);background:rgba(107,138,253,.10)}
  .picker input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
  .picker .plus{
    width:52px;height:52px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;
    background:var(--accent);color:#fff;font-size:1.7rem;line-height:1;
  }
  .picker h3{margin:0 0 3px;font-size:1.02rem}
  .picker p{margin:0;color:var(--muted);font-size:.87rem}

  /* uploads in flight */
  .job{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .job:last-child{border-bottom:none}
  .job .info{flex:1;min-width:0}
  .job .nm{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .job .st{font-size:.79rem;color:var(--muted)}
  .track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
  .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}

  /* file list */
  .file{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .file:last-child{border-bottom:none}
  .thumb{
    width:54px;height:54px;border-radius:13px;flex:0 0 auto;object-fit:cover;background:var(--soft);
    display:grid;place-items:center;font-size:1.3rem;color:var(--muted);border:1px solid var(--line);
  }
  .file .info{flex:1;min-width:0}
  .file .nm{font-size:.93rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .meta{font-size:.79rem;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .live{color:var(--ok);font-weight:650}
  .acts{display:flex;gap:6px;flex:0 0 auto}

  .linkrow{
    display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;
    background:var(--soft);border:1px solid var(--line);border-radius:12px;
  }
  .linkrow code{
    flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);
  }
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:.92rem}
  .err{color:var(--danger);font-size:.87rem;margin-top:8px;min-height:1.2em}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row .grow{flex:1;min-width:120px}
  label.small{font-size:.8rem;color:var(--muted);display:block;margin-bottom:5px}

  .toast{
    position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);
    background:#202634;border:1px solid var(--line);border-radius:999px;padding:11px 20px;
    font-size:.88rem;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- Anmeldung -->
  <section id="login" class="hidden">
    <div class="login">
      <div class="glyph">🔒</div>
      <h1 style="font-size:1.3rem;margin:0 0 6px">Dateien</h1>
      <p style="color:var(--muted);margin:0 0 20px;font-size:.92rem">Bitte anmelden.</p>
      <form id="loginform">
        <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" />
        <button class="btn primary block" type="submit">Anmelden</button>
      </form>
      <div class="err" id="loginerr"></div>
    </div>
  </section>

  <!-- Oberfläche -->
  <section id="app" class="hidden">
    <header>
      <h1>Dateien</h1>
      <button class="btn ghost sm" id="logout">Abmelden</button>
    </header>

    <div class="picker" id="picker">
      <input type="file" id="pick" multiple />
      <div class="plus">+</div>
      <h3>Datei hochladen</h3>
      <p>Tippen oder hierher ziehen — der Link ist danach sofort fertig.</p>
    </div>

    <div class="panel hidden" id="jobs"><h2>Läuft gerade</h2><div id="joblist"></div></div>

    <div class="panel">
      <h2>Jemand soll dir etwas schicken</h2>
      <div id="inbox-off">
        <div class="row" style="margin-bottom:10px">
          <div class="grow"><label class="small">Dateien</label><input type="number" id="in-files" value="1" min="1" max="20" /></div>
          <div class="grow"><label class="small">Max. GB pro Datei</label><input type="number" id="in-gb" value="2" min="1" max="16" /></div>
        </div>
        <button class="btn block" id="inbox-open">Upload-Link erstellen</button>
      </div>
      <div id="inbox-on" class="hidden">
        <div class="meta" style="color:var(--muted);font-size:.85rem" id="inbox-note"></div>
        <div class="linkrow"><code id="inbox-link"></code></div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary grow" id="inbox-share">Teilen</button>
          <button class="btn danger grow" id="inbox-close">Schließen</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Auf dem Pi</h2>
      <div id="files"><div class="empty">Wird geladen…</div></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let CHUNK = 32 * 1024 * 1024;

const fmt = (n) => {
  const u = ['B','KB','MB','GB','TB']; let v = Number(n)||0, i = 0;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + ' ' + u[i];
};
const GLYPH = { image:'🖼', video:'🎬', audio:'♪', pdf:'📕', text:'📝', file:'📄' };

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function api(path, options = {}) {
  const r = await fetch(path, options);
  if (!r.ok) {
    let detail = `HTTP ${r.status}`;
    try { detail = (await r.json()).detail || detail; } catch (_) {}
    const err = new Error(detail); err.status = r.status; throw err;
  }
  return r.json();
}
const post = (path, body) => api(path, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body || {}),
});

// Sharing has to happen inside the tap that asked for it, otherwise iOS
// rejects the share sheet. The link therefore already exists by then.
async function handOver(url, title) {
  if (navigator.share) {
    try { await navigator.share({ title, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert'); }
  catch (_) { prompt('Link', url); }
}

// ---- Anmeldung ----
$('loginform').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginerr').textContent = '';
  try {
    await post('/admin/api/login', { password: $('pw').value });
    $('pw').value = '';
    boot();
  } catch (err) { $('loginerr').textContent = err.message; }
});
$('logout').addEventListener('click', async () => {
  await post('/admin/api/logout'); boot();
});

// ---- Hochladen ----
function putChunk(url, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();
      let d = `HTTP ${xhr.status}`;
      try { d = JSON.parse(xhr.responseText).detail || d; } catch (_) {}
      reject(new Error(d));
    };
    xhr.onerror = () => reject(new Error('Verbindung unterbrochen'));
    xhr.send(blob);
  });
}

async function uploadOne(file, ui) {
  const init = await post('/api/upload/init', { name: file.name, size: file.size });
  const chunks = Math.max(1, Math.ceil(file.size / init.chunkSize));
  let sent = 0;
  for (let i = 0; i < chunks; i++) {
    const blob = file.slice(i * init.chunkSize, Math.min((i+1) * init.chunkSize, file.size));
    const base = sent;
    ui.st.textContent = chunks > 1 ? `Teil ${i+1} von ${chunks}` : 'wird gesendet…';
    await putChunk(`/api/upload/part?id=${encodeURIComponent(init.uploadId)}&i=${i}`, blob,
      (loaded) => { ui.fill.style.width = ((base + loaded) / file.size) * 100 + '%'; });
    sent += blob.size;
  }
  const done = await post(`/api/upload/done?id=${encodeURIComponent(init.uploadId)}`);
  // Mint the link right away, so the next tap can share without waiting.
  const share = await post('/admin/api/share', { file: done.stored || done.name });
  return share.link;
}

async function runUploads(files) {
  if (!files.length) return;
  $('jobs').classList.remove('hidden');
  for (const file of Array.from(files)) {
    const row = document.createElement('div');
    row.className = 'job';
    row.innerHTML = `<div class="info"><div class="nm"></div><div class="st">vorbereiten…</div>
      <div class="track"><div class="fill"></div></div></div>`;
    row.querySelector('.nm').textContent = file.name;
    $('joblist').appendChild(row);
    const ui = { st: row.querySelector('.st'), fill: row.querySelector('.fill') };
    try {
      const link = await uploadOne(file, ui);
      ui.fill.style.width = '100%';
      ui.st.innerHTML = '<span class="live">fertig · Link bereit</span>';
      setTimeout(() => { row.remove(); if (!$('joblist').children.length) $('jobs').classList.add('hidden'); }, 2500);
      await handOver(link, file.name);
    } catch (err) {
      ui.st.innerHTML = `<span style="color:var(--danger)">${err.message}</span>`;
    }
  }
  loadFiles();
}

$('pick').addEventListener('change', (e) => { runUploads(e.target.files); e.target.value = ''; });
const picker = $('picker');
['dragenter','dragover'].forEach(ev => picker.addEventListener(ev, (e) => {
  e.preventDefault(); picker.classList.add('over');
}));
['dragleave','drop'].forEach(ev => picker.addEventListener(ev, (e) => {
  e.preventDefault(); picker.classList.remove('over');
}));
picker.addEventListener('drop', (e) => { if (e.dataTransfer?.files) runUploads(e.dataTransfer.files); });

// ---- Dateiliste ----
async function loadFiles() {
  let data;
  try { data = await api('/admin/api/files'); }
  catch (err) { if (err.status === 401) return boot(); throw err; }

  const host = $('files');
  if (!data.files.length) {
    host.innerHTML = '<div class="empty">Noch nichts da. Lade oben etwas hoch.</div>';
    return;
  }
  host.innerHTML = '';
  for (const f of data.files) {
    const row = document.createElement('div');
    row.className = 'file';
    const visual = (f.kind === 'image' || f.kind === 'video')
      ? `<img class="thumb" src="${f.thumb}" alt="" loading="lazy"
              onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb',textContent:'${GLYPH[f.kind]}'}))">`
      : `<div class="thumb">${GLYPH[f.kind] || GLYPH.file}</div>`;
    row.innerHTML = `${visual}
      <div class="info">
        <div class="nm"></div>
        <div class="meta"><span>${fmt(f.size)}</span>${f.share ? '<span class="live">· geteilt</span>' : ''}</div>
      </div>
      <div class="acts">
        <button class="btn sm primary" data-act="share">Teilen</button>
        <button class="btn sm ghost" data-act="more">⋯</button>
      </div>`;
    row.querySelector('.nm').textContent = f.name;

    row.querySelector('[data-act=share]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      let link = f.share;
      if (!link) {
        btn.disabled = true;
        try { link = (await post('/admin/api/share', { file: f.stored })).link; f.share = link; }
        finally { btn.disabled = false; }
      }
      await handOver(link, f.name);
      loadFiles();
    });

    row.querySelector('[data-act=more]').addEventListener('click', () => {
      const open = row.nextElementSibling?.classList.contains('linkrow');
      if (open) { row.nextElementSibling.remove(); return; }
      const extra = document.createElement('div');
      extra.className = 'linkrow';
      extra.innerHTML = `<code>${f.share || 'noch nicht geteilt'}</code>
        ${f.token ? '<button class="btn sm ghost" data-x="revoke">Link sperren</button>' : ''}
        <button class="btn sm danger" data-x="del">Löschen</button>`;
      extra.querySelector('[data-x=del]').addEventListener('click', async () => {
        if (!confirm(`„${f.name}" wirklich vom Pi löschen?`)) return;
        await post('/admin/api/delete', { file: f.stored });
        toast('Gelöscht'); loadFiles();
      });
      extra.querySelector('[data-x=revoke]')?.addEventListener('click', async () => {
        await post('/admin/api/unshare', { token: f.token });
        toast('Link gesperrt'); loadFiles();
      });
      row.after(extra);
    });
    host.appendChild(row);
  }
}

// ---- Eingangslink für andere ----
function renderInbox(inbox) {
  const on = inbox.active;
  $('inbox-off').classList.toggle('hidden', on);
  $('inbox-on').classList.toggle('hidden', !on);
  if (on) {
    $('inbox-link').textContent = inbox.link;
    $('inbox-note').textContent = `Noch ${inbox.remaining} von ${inbox.maxFiles} Uploads frei.`;
    $('inbox-share').onclick = () => handOver(inbox.link, 'Datei-Upload');
  }
}
$('inbox-open').addEventListener('click', async () => {
  const r = await post('/admin/api/inbox', { files: +$('in-files').value, maxGb: +$('in-gb').value });
  renderInbox({ active: true, link: r.link, remaining: r.remaining, maxFiles: +$('in-files').value });
  handOver(r.link, 'Datei-Upload');
});
$('inbox-close').addEventListener('click', async () => {
  await post('/admin/api/inbox/close'); toast('Geschlossen'); boot();
});

// ---- Start ----
async function boot() {
  const state = await api('/admin/api/state');
  $('login').classList.toggle('hidden', state.authed);
  $('app').classList.toggle('hidden', !state.authed);
  if (!state.configured) {
    $('loginerr').textContent = 'Kein Passwort konfiguriert. PORTAL_ADMIN_PASSWORD setzen und neu starten.';
    return;
  }
  if (!state.authed) return;
  CHUNK = state.chunkSize || CHUNK;
  renderInbox(state.inbox);
  loadFiles();
}
boot();
</script>
</body>
</html>
