<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0d12" />
<meta name="robots" content="noindex, nofollow" />
<title>__TITLE__</title>
<meta property="og:type" content="__OG_TYPE__" />
<meta property="og:title" content="__TITLE__" />
<meta property="og:description" content="__OG_DESC__" />
<meta property="og:url" content="__OG_URL__" />
<meta property="og:image" content="__OG_IMAGE__" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="__TITLE__" />
<meta name="twitter:image" content="__OG_IMAGE__" />
<style>
  :root{
    --bg:#0b0d12; --chrome:rgba(12,14,20,.82); --line:rgba(255,255,255,.10);
    --text:#f1f5f9; --muted:#9aa6b8; --accent:#6b8afd; --accent-soft:rgba(107,138,253,.16);
    --radius:16px; --pad:16px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

  /* ---- chrome ---- */
  .bar{
    position:fixed;left:0;right:0;z-index:30;display:flex;gap:12px;align-items:center;
    padding:calc(var(--pad) + var(--safe-t)) calc(var(--pad) + var(--safe-r)) var(--pad) calc(var(--pad) + var(--safe-l));
    background:linear-gradient(180deg,rgba(11,13,18,.92),rgba(11,13,18,0));
    transition:opacity .25s ease, transform .25s ease;
  }
  .bar.top{top:0}
  .bar.bottom{
    bottom:0;top:auto;justify-content:center;
    padding:var(--pad) calc(var(--pad) + var(--safe-r)) calc(var(--pad) + var(--safe-b)) calc(var(--pad) + var(--safe-l));
    background:linear-gradient(0deg,rgba(11,13,18,.92),rgba(11,13,18,0));
  }
  .chrome-hidden .bar{opacity:0;pointer-events:none}
  .bar.top{transform:translateY(0)}
  .chrome-hidden .bar.top{transform:translateY(-8px)}
  .meta{min-width:0;flex:1}
  .name{
    font-size:.98rem;font-weight:650;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sub{font-size:.8rem;color:var(--muted);margin-top:2px}

  .btn{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.07);
    color:var(--text);border-radius:999px;padding:11px 18px;font-size:.92rem;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    min-height:44px; text-decoration:none;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.icon{padding:0;width:44px;height:44px;justify-content:center;flex:0 0 auto}

  /* ---- media ---- */
  .media{max-width:100%;max-height:100%;display:block}
  img.media{object-fit:contain;width:100%;height:100%}
  video.media{width:100%;height:100%;object-fit:contain;background:#000}

  /* ---- video player ---- */
  .player{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .tap{position:absolute;inset:0;z-index:10}
  .bigplay{
    position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);
    width:78px;height:78px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(12,14,20,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#fff;display:grid;place-items:center;transition:opacity .2s,transform .2s;
  }
  .bigplay:active{transform:translate(-50%,-50%) scale(.94)}
  .bigplay.gone{opacity:0;pointer-events:none}
  .controls{
    position:fixed;z-index:30;left:0;right:0;bottom:0;
    padding:10px calc(var(--pad) + var(--safe-r)) calc(10px + var(--safe-b)) calc(var(--pad) + var(--safe-l));
    background:linear-gradient(0deg,rgba(11,13,18,.94),rgba(11,13,18,.55) 60%,rgba(11,13,18,0));
    transition:opacity .25s ease;
  }
  .chrome-hidden .controls{opacity:0;pointer-events:none}
  .scrub{padding:10px 0;cursor:pointer;touch-action:none}
  .track{position:relative;height:4px;border-radius:99px;background:rgba(255,255,255,.26)}
  .buffered{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.34);border-radius:99px;width:0}
  .played{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;width:0}
  .knob{
    position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);transition:transform .15s;
    box-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  .scrub:active .knob{transform:translate(-50%,-50%) scale(1.35)}
  .row{display:flex;align-items:center;gap:6px}
  .time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
  .spacer{flex:1}
  .ctl{
    appearance:none;background:none;border:none;color:var(--text);cursor:pointer;
    width:44px;height:44px;display:grid;place-items:center;border-radius:12px;
  }
  .ctl:active{background:rgba(255,255,255,.1)}
  .seekhint{
    position:absolute;top:50%;transform:translateY(-50%);z-index:15;
    background:rgba(12,14,20,.72);border-radius:999px;padding:10px 16px;font-weight:650;
    font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .seekhint.back{left:8%} .seekhint.fwd{right:8%}
  .seekhint.show{opacity:1}

  /* ---- cards for everything that is not a picture or a film ---- */
  .card{
    width:min(560px,calc(100% - 32px));margin:auto;padding:28px 24px;text-align:center;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:22px;
  }
  .glyph{
    width:72px;height:72px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);font-size:1.9rem;
  }
  .card h1{font-size:1.12rem;margin:0 0 6px;line-height:1.35;word-break:break-word}
  .card p{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  .card .btn{width:100%;justify-content:center}

  .textwrap{
    position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:calc(76px + var(--safe-t)) calc(var(--pad) + var(--safe-r)) calc(92px + var(--safe-b)) calc(var(--pad) + var(--safe-l));
  }
  pre.text{
    margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.84rem;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#dbe3ef;
  }
  .audiowrap{display:grid;place-items:center;width:100%;padding:0 var(--pad)}
  audio{width:min(520px,100%)}
  iframe.pdf{width:100%;height:100%;border:0;background:#fff}

  .spin{
    width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--accent);animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{
    position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);
    background:rgba(12,14,20,.92);border:1px solid var(--line);border-radius:999px;
    padding:10px 18px;font-size:.88rem;z-index:50;opacity:0;transition:opacity .25s;
    pointer-events:none;backdrop-filter:blur(12px);
  }
  .toast.show{opacity:1}
  @media (min-width:900px){ :root{--pad:24px} .name{font-size:1.05rem} }
</style>
</head>
<body>
  <div class="stage" id="stage"><div class="spin"></div></div>

  <div class="bar top">
    <div class="meta">
      <div class="name" id="name">…</div>
      <div class="sub" id="sub"></div>
    </div>
    <button class="btn icon" id="copy" title="Link kopieren" aria-label="Link kopieren">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <a class="btn primary" id="dl" download>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg>
      <span class="dl-label">Laden</span>
    </a>
  </div>

  <div class="toast" id="toast">Link kopiert</div>

<script>
const META = __META__;
const $ = (id) => document.getElementById(id);

const fmtSize = (n) => {
  const u = ['B','KB','MB','GB','TB']; let v = Number(n)||0, i = 0;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + ' ' + u[i];
};
const fmtTime = (s) => {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = Math.floor(s%60);
  return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(sec).padStart(2,'0');
};

$('name').textContent = META.name;
$('sub').textContent = [fmtSize(META.size),
  META.width ? `${META.width}×${META.height}` : null,
  META.duration ? fmtTime(META.duration) : null].filter(Boolean).join(' · ');
$('dl').href = META.base + '/dl';

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(META.base); }
  catch (_) { return; }
  const t = $('toast'); t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
});

// Chrome hides itself while a video plays and comes back on a tap, the way
// a player is expected to behave on a phone.
let hideTimer = null;
function showChrome(autoHide) {
  document.body.classList.remove('chrome-hidden');
  clearTimeout(hideTimer);
  if (autoHide) hideTimer = setTimeout(() => document.body.classList.add('chrome-hidden'), 2800);
}
function toggleChrome() {
  document.body.classList.toggle('chrome-hidden');
  clearTimeout(hideTimer);
}

const stage = $('stage');
const ICON = {
  play: '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.53.85l10.6-6.8a1 1 0 0 0 0-1.7L9.53 4.35A1 1 0 0 0 8 5.2z"/></svg>',
  pause: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>',
  vol: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>',
  mute: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m17 9 4 6m0-6-4 6"/></svg>',
  full: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
};

function renderVideo() {
  stage.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'player';
  wrap.innerHTML = `
    <video class="media" id="v" playsinline preload="metadata"
           ${META.hasThumb ? `poster="${META.base}/thumb"` : ''}>
      <source src="${META.base}/file" type="${META.mime}">
    </video>
    <div class="tap" id="tap"></div>
    <div class="seekhint back" id="hint-back">−10 s</div>
    <div class="seekhint fwd" id="hint-fwd">+10 s</div>
    <button class="bigplay" id="big" aria-label="Abspielen">${ICON.play}</button>
    <div class="controls">
      <div class="scrub" id="scrub">
        <div class="track">
          <div class="buffered" id="buf"></div>
          <div class="played" id="played"></div>
          <div class="knob" id="knob"></div>
        </div>
      </div>
      <div class="row">
        <button class="ctl" id="pp" aria-label="Abspielen">${ICON.play}</button>
        <span class="time" id="t">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="ctl" id="mute" aria-label="Ton aus">${ICON.vol}</button>
        <button class="ctl" id="fs" aria-label="Vollbild">${ICON.full}</button>
      </div>
    </div>`;
  stage.appendChild(wrap);

  const v = $('v'), big = $('big'), pp = $('pp');
  const setIcons = () => {
    const i = v.paused ? ICON.play : ICON.pause;
    pp.innerHTML = i;
    big.classList.toggle('gone', !v.paused);
  };
  const toggle = () => { v.paused ? v.play() : v.pause(); };

  big.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
  pp.addEventListener('click', toggle);
  v.addEventListener('play', () => { setIcons(); showChrome(true); });
  v.addEventListener('pause', () => { setIcons(); showChrome(false); });
  v.addEventListener('loadedmetadata', () => {
    $('t').textContent = `0:00 / ${fmtTime(v.duration)}`;
  });
  v.addEventListener('timeupdate', () => {
    const pct = v.duration ? (v.currentTime / v.duration) * 100 : 0;
    $('played').style.width = pct + '%';
    $('knob').style.left = pct + '%';
    $('t').textContent = `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
  });
  v.addEventListener('progress', () => {
    if (v.buffered.length && v.duration) {
      $('buf').style.width = (v.buffered.end(v.buffered.length-1) / v.duration) * 100 + '%';
    }
  });
  v.addEventListener('ended', () => { showChrome(false); });

  $('mute').addEventListener('click', () => {
    v.muted = !v.muted;
    $('mute').innerHTML = v.muted ? ICON.mute : ICON.vol;
  });
  $('fs').addEventListener('click', () => {
    if (document.fullscreenElement) return document.exitFullscreen();
    // iPhone Safari only offers fullscreen on the video element itself.
    if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  });

  // Scrubbing by pointer, so a finger drag works the same as a mouse drag.
  const scrub = $('scrub');
  let scrubbing = false;
  const seekTo = (clientX) => {
    const r = scrub.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    if (v.duration) v.currentTime = ratio * v.duration;
    $('played').style.width = ratio * 100 + '%';
    $('knob').style.left = ratio * 100 + '%';
  };
  scrub.addEventListener('pointerdown', (e) => {
    scrubbing = true; scrub.setPointerCapture(e.pointerId); seekTo(e.clientX); showChrome(false);
  });
  scrub.addEventListener('pointermove', (e) => { if (scrubbing) seekTo(e.clientX); });
  scrub.addEventListener('pointerup', () => { scrubbing = false; if (!v.paused) showChrome(true); });

  // Tap to toggle chrome, double tap on a side to jump, like the big players.
  let lastTap = 0, tapTimer = null;
  $('tap').addEventListener('click', (e) => {
    const now = Date.now();
    if (now - lastTap < 300) {
      clearTimeout(tapTimer);
      lastTap = 0;
      const forward = e.clientX > window.innerWidth / 2;
      v.currentTime = Math.min(v.duration || 0, Math.max(0, v.currentTime + (forward ? 10 : -10)));
      const hint = $(forward ? 'hint-fwd' : 'hint-back');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 450);
      return;
    }
    lastTap = now;
    tapTimer = setTimeout(() => { v.paused ? toggle() : toggleChrome(); }, 260);
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') v.currentTime += 5;
    if (e.code === 'ArrowLeft') v.currentTime -= 5;
  });

  v.addEventListener('error', () => renderCard('🎬', 'Dieses Video kann der Browser nicht abspielen',
    'Das Format wird hier nicht unterstützt. Herunterladen und lokal öffnen funktioniert.'));
  setIcons();
  showChrome(false);
}

function renderImage() {
  stage.innerHTML = '';
  const img = document.createElement('img');
  img.className = 'media';
  img.alt = META.name;
  img.decoding = 'async';
  // The thumbnail is already generated, so show it immediately and let the
  // full rendition replace it once it has arrived.
  if (META.hasThumb) img.src = META.base + '/thumb';
  const full = new Image();
  full.onload = () => { img.src = full.src; };
  full.onerror = () => {
    if (!META.hasThumb) renderCard('🖼', 'Vorschau nicht möglich', 'Die Datei lässt sich hier nicht anzeigen.');
  };
  full.src = META.base + '/preview';
  stage.appendChild(img);
  stage.addEventListener('click', toggleChrome);
  showChrome(false);
}

function renderAudio() {
  stage.innerHTML = `<div class="audiowrap"><div class="card">
      <div class="glyph">♪</div>
      <h1>${META.name}</h1><p>${fmtSize(META.size)}</p>
      <audio controls preload="metadata" src="${META.base}/file"></audio>
    </div></div>`;
}

function renderPdf() {
  stage.innerHTML = `<iframe class="pdf" src="${META.base}/file#view=FitH" title="${META.name}"></iframe>`;
}

async function renderText() {
  stage.innerHTML = '<div class="textwrap"><pre class="text" id="pre">…</pre></div>';
  try {
    const r = await fetch(META.base + '/file', { headers: { Range: 'bytes=0-262143' } });
    const body = await r.text();
    $('pre').textContent = body + (META.size > 262144 ? '\n\n… gekürzt, vollständige Datei per Download.' : '');
  } catch (_) {
    $('pre').textContent = 'Inhalt konnte nicht geladen werden.';
  }
}

function renderCard(glyph, title, copy) {
  stage.innerHTML = `<div class="card">
      <div class="glyph">${glyph}</div>
      <h1>${title}</h1><p>${copy}</p>
      <a class="btn primary" href="${META.base}/dl" download>Herunterladen · ${fmtSize(META.size)}</a>
    </div>`;
}

if (META.kind === 'video' && META.playable) renderVideo();
else if (META.kind === 'video') renderCard('🎬', META.name, `Dieses Videoformat spielt kein Browser ab. ${fmtSize(META.size)}`);
else if (META.kind === 'image') renderImage();
else if (META.kind === 'audio') renderAudio();
else if (META.kind === 'pdf') renderPdf();
else if (META.kind === 'text') renderText();
else renderCard('📄', META.name, `Für diesen Dateityp gibt es keine Vorschau. ${fmtSize(META.size)}`);
</script>
</body>
</html>
