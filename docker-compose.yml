services:
  upload-portal:
    build: ./backend
    container_name: upload-portal
    restart: unless-stopped
    environment:
      # Browser origin allowed to call the API. Must match the Pages domain.
      PORTAL_ORIGIN: https://upload.t1mo.dev
      # Base of the link that portalctl prints when a session opens.
      PORTAL_LINK_BASE: https://upload.t1mo.dev
      # Share links are served by the Pi itself, so a messenger fetching one
      # gets Open Graph tags and shows a real preview card.
      PORTAL_PUBLIC_BASE: https://up.t1mo.dev
      # Unlocks the dashboard at /admin. Comes from .env, which is not in git.
      # Without it the dashboard refuses to open at all.
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?bitte .env anlegen}
    volumes:
      # Uploads land on the USB disk, never on the SD card.
      - /home/twiese/work/nextcloud-pi/data/upload-portal:/data
    ports:
      # Only cloudflared on the host talks to this, so keep it off the LAN.
      - "127.0.0.1:8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
