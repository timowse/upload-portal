services:
  upload-portal:
    build:
      # The root is the build context so the image can take index.html,
      # which GitHub Pages serves too. One file, two hostnames.
      context: .
      dockerfile: backend/Dockerfile
    container_name: upload-portal
    restart: unless-stopped
    environment:
      # Browser origin allowed to call the API: the page on GitHub Pages.
      PORTAL_ORIGIN: https://upload.t1mo.dev
      # Where share links point. The Pi serves them itself, so a messenger
      # fetching one gets Open Graph tags and shows a preview card.
      PORTAL_PUBLIC_BASE: https://up.t1mo.dev
      # How long an uploaded file lives, and how big it may be.
      PORTAL_DAYS: "30"
      PORTAL_MAX_GB: "2"
      # Refuse uploads while less than this is free, so a full disk never
      # takes the rest of the Pi down.
      PORTAL_KEEP_FREE_GB: "5"
      # Nothing here authenticates a caller, so cap how fast one address can
      # start uploads.
      PORTAL_UPLOADS_PER_HOUR: "30"
    volumes:
      # Uploads land on the USB disk, never on the SD card.
      - /home/twiese/work/nextcloud-pi/data/upload-portal:/data
    ports:
      # Only cloudflared on the host talks to this, so keep it off the LAN.
      - "127.0.0.1:8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
