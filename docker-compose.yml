services:
  upload-portal:
    build:
      # The root is the build context so the image can take index.html.
      context: .
      dockerfile: backend/Dockerfile
    container_name: upload-portal
    restart: unless-stopped
    environment:
      # Page, API and share links all live on one hostname, served by the Pi
      # through the tunnel. Nothing is cross-origin any more.
      PORTAL_ORIGIN: https://share.t1mo.dev
      PORTAL_PUBLIC_BASE: https://share.t1mo.dev
      # A file up to BASE_GB is kept DAYS. Larger ones are allowed up to
      # MAX_GB and kept correspondingly less, so size times days stays
      # roughly constant.
      PORTAL_BASE_GB: "5"
      PORTAL_MAX_GB: "10"
      PORTAL_DAYS: "30"
      PORTAL_MIN_DAYS: "7"
      # Refuse uploads while less than this is free, so a full disk never
      # takes the rest of the Pi down.
      PORTAL_KEEP_FREE_GB: "10"
      # Nothing authenticates a caller, so cap how fast one address can
      # start uploads.
      PORTAL_UPLOADS_PER_HOUR: "30"
    volumes:
      # Uploads land on the USB disk, never on the SD card.
      - /home/twiese/work/nextcloud-pi/data/upload-portal:/data
    ports:
      # Only cloudflared on the host talks to this, so keep it off the LAN.
      - "127.0.0.1:8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
